name: Build Project

on: [push]

jobs:
  build_project:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: 3.9 
        
    - name: Create Test Plan in Testiny
      env:
        TESTINY_API_KEY: tny_felpITCTpfulA2YFIPfRA9WbRocoOpp0cb47pZu9jFWEVWYh
      run: |
        curl -X POST https://app.testiny.io/api/v1/testplan \
        -H "Authorization: Bearer $TESTINY_API_KEY" \
        -H "Content-Type: application/json" \
        -d '{
              "name": "Test Plan for Build ${GITHUB_SHA}",
              "description": "Automated test plan created by GitHub Actions for build ${GITHUB_SHA}",
              "projectId": 1
            }'


    - name: Set up enviroment
      run: |
        echo "*** Checking the Python version..."
        python3 --version
        echo "*** Creating a Python virtual environment"
        python3 -m venv ~/venv
        echo "*** Installing Selenium and Chrome for BDD"
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y sqlite3 ca-certificates chromium-driver python3-selenium
        echo "*** Installing Python depenencies..."
        source ~/venv/bin/activate && python3 -m pip install --upgrade pip wheel
        source ~/venv/bin/activate && pip install -r requirements.txt
        
    - name: Start PostgreSQL container
      run: |
        docker run -d --name postgres \
        -p 5432:5432 \
        -e POSTGRES_PASSWORD=postgres \
        -v postgres:/var/lib/postgresql/data \
        postgres:alpine
        docker ps

    - name: Analysing the code with pylint
      run: |
        source ~/venv/bin/activate
        python3 -m pylint $(git ls-files '*.py') || true
        
    - name: Run unit tests
      run: |
        source ~/venv/bin/activate
        nosetests --with-coverage
        
    - name: Run Flask app
      run: |
        source ~/venv/bin/activate
        export FLASK_APP=service/__init__.py
        flask run --host=0.0.0.0 &
        sleep 5
        
    - name: Run bdd tests
      run: |
        source ~/venv/bin/activate
        python3 -m behave
